<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="author" content="Elisa Schafer Meneguini Silva">
    <meta name="description" content="Este é um site para testar meus conhecimentos em HTML, CSS e JavaScript">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>CEP</title>
    <link rel="stylesheet" href="./src/styles/style.css">
    <script src="./src/js/script.js" defer></script>
</head>

<body>

    <header>
        <div>
            <img src="./src/assets/images/logo.svg" alt="Logo do E-commerce">
        </div>

        <div class="nav-bar-header">
            <nav class="navigation-header">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Produtos</a></li>
                    <li><a href="#">Sobre nós</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>
            </nav>
        </div>
        <div>
            <nav>
                <a href="" class="btn-nav-header">Login</a>
            </nav>
        </div>
    </header>

    <main>
        <div>
            <img src="./src/assets/images/Product.svg" alt="">
        </div>
        <div class="product-info">
            <div class="rating">
                <img src="./src/assets/images/Vector.svg" alt="Estrela" loading="lazy">
                <img src="./src/assets/images/Vector.svg" alt="Estrela" loading="lazy">
                <img src="./src/assets/images/Vector.svg" alt="Estrela" loading="lazy">
                <img src="./src/assets/images/Vector.svg" alt="Estrela" loading="lazy">
                <img src="./src/assets/images/Vector.svg" alt="Estrela" loading="lazy">
                <span class="rating-number">5.0 Estrelas</span>
                <span class="rating-text">(21.671 avaliações)</span>
            </div>

            <h1 class="product-title">
                2020 Apple MacBook Pro with Apple M1 Chip (13-inch, 8GB RAM, 256GB SSD Storage) - Space Gray
            </h1>

            <div class="price-block">
                <span class="current-price">R$ 5.299,00</span>
                <span class="old-price">R$ 7.000,00</span>
                <span class="discount-badge">24,3% OFF</span>
            </div>
            </div>


    </main>

</body>

</html>
